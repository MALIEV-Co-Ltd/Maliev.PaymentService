name: CI - Staging image promotion

on:
  push:
    tags: ["release/v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: payment-image-staging
  cancel-in-progress: false

env:
  REGISTRY_HOST: asia-southeast1-docker.pkg.dev
  SOURCE_REPOSITORY: maliev-payment-artifact-dev
  TARGET_REPOSITORY: maliev-payment-artifact-staging
  IMAGE_NAME: maliev-payment-service

jobs:
  promote:
    name: Promote verified development digest to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          create_credentials_file: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Promote exact development digest
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${GITHUB_REF_NAME#release/v}"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          SOURCE_IMAGE="$REGISTRY_HOST/$GCP_PROJECT_ID/$SOURCE_REPOSITORY/$IMAGE_NAME"
          TARGET_IMAGE="$REGISTRY_HOST/$GCP_PROJECT_ID/$TARGET_REPOSITORY/$IMAGE_NAME"
          TARGET_DIGEST="$(bash scripts/promote-artifact-image.sh \
            "$SOURCE_IMAGE" "dev-$GITHUB_SHA" \
            "$TARGET_IMAGE" "$RELEASE_VERSION")"
          printf 'Promoted `%s@%s` to `%s@%s` as release `%s`.\n' \
            "$SOURCE_IMAGE" "$TARGET_DIGEST" "$TARGET_IMAGE" "$TARGET_DIGEST" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
