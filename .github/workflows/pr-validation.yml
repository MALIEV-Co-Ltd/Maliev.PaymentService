name: PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-packages:
    name: Build exact public-source dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      config_only: ${{ steps.scope.outputs.config_only }}
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect policy-only scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_REF" ]]; then
            echo "config_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_REF" --depth=1
          changed_files="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          printf '%s\n' "$changed_files"
          if grep -Ev '^\.github/(dependabot\.yml|workflows/pr-validation\.yml)$' <<< "$changed_files" | grep -q .; then
            echo "config_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "config_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Dependabot policy
        if: steps.scope.outputs.config_only == 'true'
        shell: ruby {0}
        run: |
          require "yaml"
          path = ".github/dependabot.yml"
          bytes = File.binread(path)
          abort "UTF-8 BOM is not allowed" if bytes.start_with?("\xEF\xBB\xBF".b)
          config = YAML.safe_load(bytes, aliases: false)
          abort "Dependabot v2 is required" unless config["version"] == 2
          updates = config.fetch("updates")
          expected = { "github-actions" => 5, "nuget" => 10, "docker" => 5 }
          abort "Unexpected ecosystems" unless updates.map { |update| update["package-ecosystem"] }.sort == expected.keys.sort
          updates.each do |update|
            ecosystem = update.fetch("package-ecosystem")
            abort "Unexpected limit" unless update["open-pull-requests-limit"] == expected.fetch(ecosystem)
            abort "Weekly schedule required" unless update.dig("schedule", "interval") == "weekly"
            group = update.fetch("groups").values.fetch(0)
            abort "Only minor and patch may be grouped" unless group["update-types"].sort == ["minor", "patch"]
          end

      - name: Set up .NET
        if: steps.scope.outputs.config_only != 'true'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve the complete dependency graph
        if: steps.scope.outputs.config_only != 'true'
        run: dotnet restore Maliev.PaymentService.sln

  build-and-test:
    name: Release build, test, and audit
    needs: dependency-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Confirm policy-only validation
        if: needs.dependency-packages.outputs.config_only == 'true'
        run: echo "Runtime build is unchanged; Dependabot policy validation passed."

      - name: Checkout source
        if: needs.dependency-packages.outputs.config_only != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        if: needs.dependency-packages.outputs.config_only != 'true'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: needs.dependency-packages.outputs.config_only != 'true'
        run: dotnet restore Maliev.PaymentService.sln

      - name: Build
        if: needs.dependency-packages.outputs.config_only != 'true'
        run: dotnet build Maliev.PaymentService.sln --configuration Release --no-restore

      - name: Test
        if: needs.dependency-packages.outputs.config_only != 'true'
        run: dotnet test Maliev.PaymentService.sln --configuration Release --no-build --no-restore --verbosity normal

      - name: Audit resolved NuGet graph
        if: needs.dependency-packages.outputs.config_only != 'true'
        run: dotnet list Maliev.PaymentService.sln package --include-transitive --vulnerable --no-restore

  container:
    name: Build and scan production image
    needs: dependency-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: maliev-paymentservice:pr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Confirm policy-only validation
        if: needs.dependency-packages.outputs.config_only == 'true'
        run: echo "Runtime image is unchanged; Dependabot policy validation passed."

      - name: Checkout source
        if: needs.dependency-packages.outputs.config_only != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: needs.dependency-packages.outputs.config_only != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build local production image
        if: needs.dependency-packages.outputs.config_only != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Maliev.PaymentService.Api/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}

      - name: Validate runtime image metadata
        if: needs.dependency-packages.outputs.config_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(docker image inspect "$IMAGE_TAG")"
          test "$(jq -r '.[0].Config.User' <<< "$metadata")" = "app"
          test "$(jq -c '.[0].Config.Entrypoint' <<< "$metadata")" = '["dotnet","Maliev.PaymentService.Api.dll"]'

      - name: Scan image for high-severity vulnerabilities
        if: needs.dependency-packages.outputs.config_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
