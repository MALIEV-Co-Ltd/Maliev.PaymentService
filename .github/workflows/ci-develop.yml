name: CI - Develop image publication

on:
  push:
    branches: [develop]

permissions:
  contents: read
  id-token: write

concurrency:
  group: payment-image-development
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  ServiceDefaultsVersion: 1.0.81-alpha
  MessagingContractsVersion: 1.0.91-alpha
  REGISTRY_HOST: asia-southeast1-docker.pkg.dev
  IMAGE_REPOSITORY: maliev-payment-artifact-dev
  IMAGE_NAME: maliev-payment-service

jobs:
  validate:
    name: Validate source before publication
    permissions:
      contents: read
    uses: ./.github/workflows/_build-and-test.yml

  publish:
    name: Build and publish immutable development image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: development
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact MessagingContracts source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: 0bcd4c704d842211c5ff9bd6b9c4b3aacfcbd8e7
          path: .ci-sources/Maliev.MessagingContracts
          persist-credentials: false

      - name: Checkout exact ServiceDefaults source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: 7121d57705fc1eff6c7ebb6a69e33e9c26ebfccc
          path: .ci-sources/Maliev.Aspire
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Reconstruct exact MALIEV dependency packages
        run: bash scripts/prepare-payment-ci-packages.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          create_credentials_file: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Build and push image once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Maliev.PaymentService.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          build-args: |
            dependency_restore_stage=restore-local
            SERVICE_DEFAULTS_VERSION=${{ env.ServiceDefaultsVersion }}
            MESSAGING_CONTRACTS_VERSION=${{ env.MessagingContractsVersion }}
          provenance: mode=max
          sbom: true

      - name: Verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$REGISTRY_HOST/$GCP_PROJECT_ID/$IMAGE_REPOSITORY/$IMAGE_NAME"
          remote_digest="$(gcloud artifacts docker images describe "$image@$DIGEST" \
            --project "$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')"
          test "$remote_digest" = "$DIGEST"
          printf 'Published `%s@%s` from commit `%s`.\n' "$image" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
