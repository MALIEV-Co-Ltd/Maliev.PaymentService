name: Reusable Validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: maliev-paymentservice:validation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Maliev.PaymentService.sln --configfile nuget.validation.config --locked-mode
      - name: Audit dependencies
        run: dotnet list Maliev.PaymentService.sln package --vulnerable --include-transitive --no-restore
      - name: Build
        run: dotnet build Maliev.PaymentService.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Maliev.PaymentService.sln --configuration Release --no-build --no-restore --verbosity normal
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build local production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Maliev.PaymentService.Api/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
      - name: Validate runtime image metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(docker image inspect "$IMAGE_TAG")"
          test "$(jq -r '.[0].Config.User' <<< "$metadata")" = "app"
          test "$(jq -c '.[0].Config.Entrypoint' <<< "$metadata")" = '["dotnet","Maliev.PaymentService.Api.dll"]'
      - name: Scan image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
