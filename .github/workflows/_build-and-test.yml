name: PaymentService build and test

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  ServiceDefaultsVersion: 1.0.81-alpha
  MessagingContractsVersion: 1.0.91-alpha

jobs:
  build-and-test:
    name: Release build, test, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Reconstruct exact MALIEV dependency packages
        run: bash scripts/prepare-payment-ci-packages.sh

      - name: Restore exact package graph
        run: dotnet restore Maliev.PaymentService.slnx --configfile NuGet.PRValidation.Config /p:GITHUB_ACTIONS=true /p:ServiceDefaultsVersion="1.0.81-alpha" /p:MessagingContractsVersion="1.0.91-alpha"

      - name: Build
        run: dotnet build Maliev.PaymentService.slnx --configuration Release --no-restore /p:GITHUB_ACTIONS=true /p:ServiceDefaultsVersion="1.0.81-alpha" /p:MessagingContractsVersion="1.0.91-alpha"

      - name: Test
        run: dotnet test Maliev.PaymentService.slnx --configuration Release --no-build --no-restore --verbosity normal /p:GITHUB_ACTIONS=true /p:ServiceDefaultsVersion="1.0.81-alpha" /p:MessagingContractsVersion="1.0.91-alpha"

      - name: Audit resolved NuGet graph
        run: dotnet list Maliev.PaymentService.slnx package --include-transitive --vulnerable --no-restore --configfile NuGet.PRValidation.Config
